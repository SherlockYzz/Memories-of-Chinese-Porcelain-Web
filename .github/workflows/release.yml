name: Build and Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本标签 (例如 v9.2.0)'
        required: true
        default: 'v9.2.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static engineering checks
        run: npm run check

      - name: Clean build artifacts and cold-build production dist
        shell: bash
        run: |
          rm -rf dist .cache TianQingNiHuo*.zip SHA256SUMS.txt
          npm run build

      - name: Package release archive and checksums
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
          fi
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_ENV"

          (cd dist && zip -r -q ../TianQingNiHuo.zip .)
          cp TianQingNiHuo.zip "TianQingNiHuo-${TAG_NAME}.zip"
          sha256sum TianQingNiHuo.zip "TianQingNiHuo-${TAG_NAME}.zip" > SHA256SUMS.txt
          ls -lh TianQingNiHuo.zip "TianQingNiHuo-${TAG_NAME}.zip" SHA256SUMS.txt README.md

      - name: Generate release notes
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const bt = String.fromCharCode(96);
            const tag = process.env.TAG_NAME || "v9.2.0";
            const notes = [
              "## 天青泥火 — 华夏古瓷三维研学空间 (" + tag + ")",
              "",
              "> **从泥到火，从器到鉴——数字化复原中国古瓷的一生**",
              "> 在线体验：https://sherlockyzz.github.io/Memories-of-Chinese-Porcelain-Web/",
              "",
              "### 核心更新亮点",
              "- **真 3D Three.js 互动拉坯与青花绘瓷工坊**：88 段 CatmullRomCurve3 + LatheGeometry 双壁立体器型建模、`MeshPhysicalMaterial` 双层透明清漆与柔和摄影棚高光，配合 `Raycaster` `1024×512` 曲面精确绘图、笔速压感、4/6 重对称绘制、莲瓣/梅枝/云纹/回纹四大青花点印、重置视角及本地草稿暂存/读档，1300℃ 窑火煅烧融为莹澈釉下宝蓝。",
              "- **4 件博物馆级馆藏釉面重绘与图录焕新**：升级北宋钧窑玫瑰紫窑变、元青花缠枝牡丹龙纹罐、明宣德祭红釉僧帽壶（含口沿「灯草边」露白）及清乾隆黄地洋彩开光转心瓶程序化釉面质感，并更新干净高清馆藏缩略图。",
              "- **全端极速加载与渲染管线重构**：以亚毫秒 `createStudioCubeEnv()` 替代同步 `PMREMGenerator` 阻塞、预计算缓存双尺度 Voronoi 距离场、`hero:ready` 总线错峰门控三路 WebGL 上下文，并在主展稳固后实现单路纯二进制 `fetchGlbBuffer` 静默预抓取；兼顾移动端低延迟秒开与桌面端高画质流畅浏览。",
              "- **全站细节打磨**：金缮工坊升级天然锯齿随机裂纹与金箔碎屑颗粒、优化共享 `AudioContext`、补齐中英双语词库并升级 Service Worker 缓存策略（`tianqing-nihuo-v9.2-fast`）。",
              "",
              "### 附件说明（均为全新冷构建最新产物）",
              "- " + bt + "TianQingNiHuo.zip" + bt + " / " + bt + "TianQingNiHuo-" + tag + ".zip" + bt + "：完整 " + bt + "dist/" + bt + " 纯静态构建包（可直接部署至任意静态托管或本地 HTTP Server 解压运行）。",
              "- " + bt + "SHA256SUMS.txt" + bt + "：发布包 SHA-256 校验文件。",
              "- " + bt + "README.md" + bt + "：完整网页功能与代码架构说明文档。",
              "",
              "### 本地离线运行",
              bt + bt + bt + "bash",
              "unzip TianQingNiHuo.zip -d tianqing-nihuo && cd tianqing-nihuo",
              "npx serve .",
              "# 或 python3 -m http.server 4173",
              bt + bt + bt
            ].join("\n");
            fs.writeFileSync("release-notes.md", notes, "utf8");
          '

      - name: Create or update latest Release and purge all legacy Releases/Tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TITLE="🏺 天青泥火 ${TAG_NAME} · 真3D青花拉坯 / 四大名瓷精绘 / 全端极速加载引擎"
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" --title "${TITLE}" --notes-file release-notes.md --latest
            gh release upload "${TAG_NAME}" TianQingNiHuo.zip "TianQingNiHuo-${TAG_NAME}.zip" SHA256SUMS.txt README.md --clobber
          else
            gh release create "${TAG_NAME}" TianQingNiHuo.zip "TianQingNiHuo-${TAG_NAME}.zip" SHA256SUMS.txt README.md --title "${TITLE}" --notes-file release-notes.md --latest
          fi

          # 彻底删除历史旧版 Release 及其对应 Tag，确保 GitHub 释放列表仅留存当前最新版本
          OLD_RELEASES=$(gh release list --limit 50 --json tagName -q '.[].tagName' || true)
          for old in $OLD_RELEASES; do
            if [ -n "$old" ] && [ "$old" != "${TAG_NAME}" ]; then
              echo "Deleting legacy release & tag: $old"
              gh release delete "$old" --yes --cleanup-tag || true
            fi
          done

          # 额外清理未关联 Release 的旧远端 Tag（如历史 v9.0）
          for tag in $(git ls-remote --tags origin | awk -F'refs/tags/' '{print $2}' | grep -v '\^{}' || true); do
            if [ -n "$tag" ] && [ "$tag" != "${TAG_NAME}" ]; then
              echo "Deleting legacy remote tag: $tag"
              git push origin --delete "refs/tags/${tag}" || true
            fi
          done
