    <script>
        try {
            var t = localStorage.getItem('huaxia_theme');
            if (t === 'dark' || t === 'light') {
                document.documentElement.setAttribute('data-theme', t);
                var m = document.querySelector('meta[name="theme-color"]');
                if (m) m.setAttribute('content', t === 'dark' ? '#080C10' : '#F4EFE6');
            }
            var a = JSON.parse(localStorage.getItem('tq_a11y_v1') || '{}');
            if (a.largeText) document.documentElement.setAttribute('data-large-text', '');
            if (a.highContrast) document.documentElement.setAttribute('data-high-contrast', '');
            if (a.reduceMotion) document.documentElement.setAttribute('data-reduce-motion', '');
        } catch (e) {}
    </script>
