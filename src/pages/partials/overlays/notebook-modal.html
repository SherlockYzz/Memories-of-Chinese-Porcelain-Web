<!-- ==================== 个人古瓷研学手记与收藏夹模态框 ==================== -->
<div id="study-notebook-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="study-notebook-title" data-action-self="closeStudyNotebook()">
    <div class="modal-content-lg">
        <div class="flex items-center justify-between mb-4 pb-3 border-b border-border-light">
            <h3 id="study-notebook-title" class="font-serif-cn text-lg font-medium text-text-title flex items-center gap-2">
                <i class="fa-solid fa-bookmark text-tianqing-deep" aria-hidden="true"></i>
                <span>个人古瓷研学手记 · 典藏集</span>
            </h3>
            <button data-action="closeStudyNotebook()" class="w-8 h-8 rounded-full hover:bg-yuebai flex items-center justify-center transition-colors" aria-label="关闭研学手记">
                <i class="fa-solid fa-xmark text-text-body" aria-hidden="true"></i>
            </button>
        </div>

        <div class="space-y-4 max-h-[68vh] overflow-y-auto pr-1">
            <div>
                <h4 class="text-xs font-serif-cn font-medium text-text-title mb-2 flex items-center justify-between">
                    <span>【已收录馆藏标本】</span>
                    <span class="text-[11px] text-text-muted">在典藏珍库点击书签即可收录</span>
                </h4>
                <div id="study-notebook-list" class="space-y-2"></div>
            </div>

            <div class="pt-3 border-t border-border-light">
                <h4 class="text-xs font-serif-cn font-medium text-text-title mb-2">【个人考据随笔与灵感手记】</h4>
                <textarea id="study-notebook-textarea" data-action-input="saveStudyNotes()" rows="4" aria-label="个人考据随笔与灵感手记" placeholder="在此随时记录您的古瓷鉴赏心得、窑口考证灵感、胎釉比对备忘（浏览器本地自动持久化保存）..." class="w-full bg-yuebai/50 border border-border-light rounded-xl p-3 text-xs text-text-title outline-none font-light resize-none leading-relaxed"></textarea>
            </div>
        </div>

        <div class="mt-4 pt-3 border-t border-border-light flex flex-col sm:flex-row items-center justify-between gap-3">
            <span class="text-[11px] text-text-muted font-light"><i class="fa-solid fa-database mr-1 text-tianqing" aria-hidden="true"></i>仅存于本机浏览器 localStorage（可随时导出或清除）</span>
            <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto justify-end">
                <button data-action="clearStudyData()" class="px-3.5 py-2 border border-red-500/40 text-red-500 rounded-full text-xs font-serif-cn hover:bg-red-500/10 transition-colors flex items-center gap-1">
                    <i class="fa-solid fa-trash-can text-[10px]" aria-hidden="true"></i>
                    <span>清空数据</span>
                </button>
                <button data-action="exportStudyNotes()" class="px-4 py-2 bg-tianqing-deep text-white rounded-full text-xs font-serif-cn hover:bg-tianqing transition-colors shadow-sm flex items-center gap-1.5">
                    <i class="fa-solid fa-file-export text-[10px]" aria-hidden="true"></i>
                    <span>导出 Markdown 研学手记</span>
                </button>
                <button data-action="closeStudyNotebook()" class="px-4 py-2 bg-yuebai text-text-body rounded-full text-xs font-serif-cn">
                    关闭
                </button>
            </div>
        </div>
    </div>
</div>
