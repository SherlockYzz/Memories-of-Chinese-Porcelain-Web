<!-- ==================== 全局快速检索命令面板模态框 (Ctrl/Cmd + K) ==================== -->
<div id="command-palette-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="command-palette-title" data-action-self="closeCommandPalette()">
    <div class="modal-content-lg">
        <div class="flex items-center justify-between mb-3 pb-3 border-b border-border-light">
            <h3 id="command-palette-title" class="flex items-center gap-2 text-text-title font-serif-cn font-semibold text-sm sm:text-base">
                <i class="fa-solid fa-magnifying-glass text-tianqing-deep" aria-hidden="true"></i>
                <span>博古通今 · 全站器物 / 窑口 / 釉色 / 工序快速检索引擎</span>
            </h3>
            <button data-action="closeCommandPalette()" class="w-8 h-8 rounded-full hover:bg-yuebai flex items-center justify-center" aria-label="关闭检索面板">
                <i class="fa-solid fa-xmark text-text-body" aria-hidden="true"></i>
            </button>
        </div>
        <input id="command-search-input" type="text" data-action-input="debouncedRenderCommandResults($value)" placeholder="输入关键词检索（如：汝窑、官窑、苏麻离青、水仙盆、梅瓶、实测扫描...）" aria-label="检索古瓷器物、窑口、釉色或工序" class="w-full px-4 py-3 rounded-xl bg-bg-main border border-border-light text-xs sm:text-sm text-text-title outline-none mb-4 font-serif-cn">
        <div id="command-results-list" role="listbox" aria-label="检索结果" class="space-y-2 max-h-[52vh] overflow-y-auto pr-1"></div>
    </div>
</div>
